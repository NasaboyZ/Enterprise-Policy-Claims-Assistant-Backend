services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      MODEL_PATH: /app/models/fraud_model.pkl
      CHROMA_DIR: /app/data/chroma
      EMBEDDING_CACHE_DIR: /app/models/embeddings
      REPORTS_DIR: /app/reports
      RAGAS_DO_NOT_TRACK: "true"
    volumes:
      - documents:/app/data
      - models:/app/models
      - reports:/app/reports

volumes:
  documents:
  models:
  reports:
